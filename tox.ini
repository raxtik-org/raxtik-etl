[tox]
env_list = py311, py312, py313, py314, py315, lint, type-pyrefly, docs
minversion = 4.0

[testenv]
deps =
    -r requirements-tests.txt
commands =
    pytest -v {posargs:tests}

[testenv:lint]
deps =
    -r requirements-lint.txt
commands =
    ruff check .
    ruff format --check .
    typos

[testenv:type-pyrefly]
deps =
    -r requirements-lint.txt
commands =
    pyrefly check src/raxtik_etl

[testenv:docs]
deps =
    -r requirements-docs.txt
changedir = docs
commands =
    sphinx-build -b html . _build/html -W
