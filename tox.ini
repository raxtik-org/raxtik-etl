[tox]
env_list = py311, py312, py313, py314, py315, lint, type-pyrefly, type-mypy, docs
minversion = 4.0

[testenv]
runner = uv-venv-lock-runner
extras = dev
commands =
    pytest -v {posargs:tests}

[testenv:lint]
runner = uv-venv-lock-runner
extras = dev
commands =
    ruff check .
    ruff format --check .
    typos

[testenv:type-pyrefly]
runner = uv-venv-lock-runner
extras = dev
commands =
    pyrefly check src/raxtik_etl

[testenv:type-mypy]
runner = uv-venv-lock-runner
extras = dev
commands =
    mypy src/raxtik_etl

[testenv:docs]
runner = uv-venv-lock-runner
extras = docs
changedir = docs
commands =
    sphinx-build -b html . _build/html -W
