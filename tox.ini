[tox]
requires =
    tox-uv>=1.11.0
env_list = py311, py312, py313, py314, py315, quality, docs
minversion = 4.0

[testenv]
deps =
    -r requirements-tests.txt
commands =
    pytest -v --cov=raxtik_etl --cov-report=xml --cov-report=term {posargs:tests}

[testenv:quality]
deps =
    -r requirements-lint.txt
commands =
    ruff check .
    ruff format --check .
    typos
    pyrefly check src/raxtik_etl

[testenv:lint]
deps =
    -r requirements-lint.txt
commands =
    ruff check .
    ruff format --check .
    typos

[testenv:type-pyrefly]
deps =
    -r requirements-lint.txt
commands =
    pyrefly check src/raxtik_etl

[testenv:docs]
deps =
    -r requirements-docs.txt
changedir = docs
commands =
    sphinx-build -aEWnb html . _build/html
