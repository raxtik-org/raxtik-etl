# See https://pre-commit.com for more information
# Note: Configured for PR auto-formatting & CI automation.
ci:
  autofix_commit_msg: "chore(pr): auto fixes from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: ""

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.30.1
    hooks:
      - id: typos
