[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raxtik-etl"
version = "0.1.0.dev1"
description = "Adverse event ETL pipeline and canonical data platform for pharmacovigilance and safety data generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Raxtik Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "certifi>=2026.10.19",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "huggingface_hub>=0.23.0",
    "pre-commit>=4.0.0",
    "pyrefly>=1.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "typos>=1.30.0",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]
# Optional source connectors (to be enabled once raxtik-source-faers is published on PyPI)
# faers = [
#     "raxtik-source-faers>=0.1.0.dev0",
# ]
# all = [
#     "raxtik-source-faers>=0.1.0.dev0",
# ]

[project.urls]
Homepage = "https://github.com/raxtik-org/raxtik-etl"
Documentation = "https://raxtik-etl.readthedocs.io"
Repository = "https://github.com/raxtik-org/raxtik-etl"
Issues = "https://github.com/raxtik-org/raxtik-etl/issues"

[project.scripts]
raxtik-etl = "raxtik_etl.cli:app"


[tool.hatch.build.targets.wheel]
packages = ["src/raxtik_etl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
]

[dependency-groups]
dev = [
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
]
