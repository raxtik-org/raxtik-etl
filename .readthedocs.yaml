# Read the Docs configuration file (Version 2)
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation with Sphinx using docs/conf.py
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Python environment and dependencies
python:
  install:
    - method: pip
      path: .
      extra_dependencies:
        - .[docs]
